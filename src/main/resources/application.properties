spring.application.name=reservation_restaurant

# ===== H2 (in-memory database, used by default) =====
spring.datasource.url=jdbc:h2:mem:reservation
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop

# ===== MySQL (uncomment this block and comment out the H2 block above) =====
#spring.datasource.url=jdbc:mysql://localhost:3306/reservation_restaurant
#spring.datasource.username=root
#spring.datasource.password=your_password
#spring.jpa.hibernate.ddl-auto=update

# ===== JPA =====
spring.jpa.show-sql=true
# Run data.sql after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# How long one reservation holds a table (hours)
app.reservation.duration-hours=2
